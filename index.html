<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zubeen Garg — Luit Kontho</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 20%, #292929 0%, #111 38%, #050505 75%);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .player {
      width: min(430px, 92vw);
      padding: 24px;
    }

    .online {
      color: #888;
      font-size: 13px;
      margin-bottom: 18px;
      letter-spacing: .4px;
    }

    .online::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #48d369;
      border-radius: 50%;
      margin-right: 7px;
      box-shadow: 0 0 10px #48d369;
    }

    .artwork {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #151515;
      border-radius: 4px;
      box-shadow: 0 25px 70px rgba(0,0,0,.65);
    }

    .artwork img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .7s ease;
    }

    .player.playing .artwork img {
      transform: scale(1.025);
    }

    .track {
      margin-top: 18px;
    }

    .track-title {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.3;
    }

    .artist {
      color: #777;
      margin-top: 6px;
      font-size: 14px;
    }

    .progress-area {
      margin-top: 22px;
    }

    .progress {
      width: 100%;
      height: 3px;
      background: #292929;
      cursor: pointer;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: white;
    }

    .time {
      display: flex;
      justify-content: space-between;
      color: #666;
      font-size: 11px;
      margin-top: 7px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      margin-top: 22px;
    }

    button {
      border: none;
      background: transparent;
      color: white;
      cursor: pointer;
      font-size: 19px;
      transition: opacity .2s, transform .2s;
    }

    button:hover {
      opacity: .65;
      transform: scale(1.08);
    }

    .play {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: white;
      color: black;
      font-size: 17px;
    }

    .credit {
      text-align: center;
      margin-top: 35px;
      color: #3f3f3f;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    @media (max-width: 500px) {
      .player {
        padding: 18px;
      }

      .track-title {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="player" id="player">

    <div class="online">Zubeen Da • Tribute</div>

    <div class="artwork">
      <img
        src="zubeen.jpg"
        alt="Zubeen Garg"
      />
    </div>

    <section class="track">
      <div class="track-title">
        Zubeen Garg — Luit Kontho
      </div>

      <div class="artist">
        In Loving Memory • 1972–2025
      </div>
    </section>

    <div class="progress-area">

      <div class="progress" id="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="time">
        <span id="current">0:00</span>
        <span id="duration">0:00</span>
      </div>

    </div>

    <div class="controls">

      <button id="back">↶</button>

      <button class="play" id="play">▶</button>

      <button id="forward">↷</button>

    </div>

    <div class="credit">
      The Voice of Assam
    </div>

  </main>

  <audio id="audio" src="zubeen-song.mp3"></audio>

  <script>
    const audio = document.getElementById("audio");
    const play = document.getElementById("play");
    const player = document.getElementById("player");
    const progress = document.getElementById("progress");
    const progressBar = document.getElementById("progressBar");
    const current = document.getElementById("current");
    const duration = document.getElementById("duration");

    function formatTime(seconds) {
      if (!seconds || isNaN(seconds)) return "0:00";

      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

      return `${mins}:${secs}`;
    }

    play.addEventListener("click", () => {
      if (audio.paused) {
        audio.play();
        play.textContent = "Ⅱ";
        player.classList.add("playing");
      } else {
        audio.pause();
        play.textContent = "▶";
        player.classList.remove("playing");
      }
    });

    audio.addEventListener("loadedmetadata", () => {
      duration.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", () => {
      const percent =
        (audio.currentTime / audio.duration) * 100;

      progressBar.style.width = `${percent || 0}%`;
      current.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener("ended", () => {
      play.textContent = "▶";
      player.classList.remove("playing");
      progressBar.style.width = "0%";
    });

    progress.addEventListener("click", (event) => {
      const rect = progress.getBoundingClientRect();
      const percent =
        (event.clientX - rect.left) / rect.width;

      audio.currentTime = percent * audio.duration;
    });

    document.getElementById("back").addEventListener("click", () => {
      audio.currentTime = Math.max(0, audio.currentTime - 10);
    });

    document.getElementById("forward").addEventListener("click", () => {
      audio.currentTime = Math.min(
        audio.duration,
        audio.currentTime + 10
      );
    });
  </script>

</body>
</html>
